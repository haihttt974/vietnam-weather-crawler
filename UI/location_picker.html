<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>🌍 CHỌN VỊ TRÍ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-fullscreen@1.0.2/dist/Leaflet.fullscreen.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.css" />
  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #172554;
      --accent: #60a5fa;
      --background: linear-gradient(135deg, #f3f4f6 0%, #e0e7ff 100%);
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background: var(--background); color: var(--text); line-height: 1.6;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    }
    header {
      background: var(--primary); color: white; width: 100%; padding: 1.5rem; text-align: center;
      box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000;
    }
    header h1 { font-size: 2rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: .5rem; text-transform: uppercase; letter-spacing: 1px;}
    main { width: 100%; max-width: 1200px; padding: 0 1rem; }
    .form-container {
      background: var(--card-bg); padding: 2.5rem; margin: 2rem auto; border-radius: 15px; box-shadow: var(--shadow);
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .form-container:hover { transform: translateY(-5px); box-shadow: 0 6px 25px rgba(0,0,0,.15); }
    .btn-group { display: flex; gap: 1.5rem; margin-bottom: 2rem; justify-content: center; flex-wrap: wrap; }
    .option {
      padding: 1rem 1.25rem; font-size: 1.05rem; font-weight: 600; border: none; border-radius: 10px;
      background: var(--primary); color: white; cursor: pointer;
      transition: background .3s ease, transform .2s ease, box-shadow .2s ease;
    }
    .option:hover { background: var(--primary-dark); transform: translateY(-3px); box-shadow: 0 4px 12px rgba(30,64,175,.3); }
    .option:active { transform: translateY(0); box-shadow: none; }

    .input-group { margin-bottom: 1.25rem; }
    .input-group label { display: block; font-weight: 600; margin-bottom: .6rem; color: var(--text); }
    .input-group input {
      width: 100%; padding: .9rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem;
      transition: border-color .3s ease, box-shadow .3s ease;
    }
    .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,64,175,.1); }

    /* Khối nhập tọa độ thủ công */
    .manual-coords { display: none; margin-top: .5rem; padding: 1rem; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 12px; }
    .manual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .manual-actions { margin-top: .75rem; display: flex; gap: .75rem; }
    .subbtn {
      padding: .75rem 1rem; border-radius: 10px; border: 0; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #0b1220;
    }
    .subbtn.secondary { background: #e5e7eb; color: #111827; }

    #map {
      height: 85vh; width: 100%; margin: 2rem auto; border-radius: 15px; border: 3px solid var(--primary);
      box-shadow: var(--shadow); position: relative; display: none; /* ẩn đến khi cần */
    }
    #sendBtn {
      width: 100%; max-width: 600px; padding: 1rem; font-size: 1.1rem; font-weight: 600; border: none; border-radius: 10px;
      background: var(--primary); color: white; cursor: pointer; transition: background .3s ease, transform .2s ease, box-shadow .2s ease;
      margin: 1rem auto; display: none;
    }
    #sendBtn.active { display: block; }
    #sendBtn:hover { background: var(--primary-dark); transform: translateY(-3px); box-shadow: 0 4px 12px rgba(30,64,175,.3); }
    #sendBtn:active { transform: translateY(0); box-shadow: none; }
    #status {
      margin-top: 1rem; font-size: 1rem; font-weight: 500; color: var(--text-light); text-align: center;
      padding: .5rem 1rem; border-radius: 8px; background: rgba(255,255,255,.9); max-width: 600px; margin-left: auto; margin-right: auto;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .form-container { margin: 1rem; padding: 1.5rem; }
      .btn-group { flex-direction: column; gap: 1rem; }
      .option { width: 100%; }
      #map { height: 60vh; }
      #sendBtn { width: 90%; }
      .manual-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header><h1>🗺️ Chọn vị trí</h1></header>
  <main>
    <div class="form-container">
      <div class="btn-group">
        <button class="option" onclick="useCurrentLocation()">📍 Vị trí của bạn</button>
        <button class="option" onclick="useMapLocation()">🗺️ Vị trí khác</button>
        <!-- Nút mới -->
        <button class="option" onclick="toggleManual()">🧭 Nhập tọa độ</button>
      </div>

      <!-- Khối nhập tọa độ thủ công -->
      <div id="manualBox" class="manual-coords" aria-hidden="true">
        <div class="manual-grid">
          <div class="input-group">
            <label for="latInput">Vĩ độ (lat)</label>
            <input id="latInput" type="text" placeholder="Ví dụ: 10.762622" inputmode="decimal" />
          </div>
          <div class="input-group">
            <label for="lonInput">Kinh độ (lon)</label>
            <input id="lonInput" type="text" placeholder="Ví dụ: 106.660172" inputmode="decimal" />
          </div>
        </div>
        <div class="manual-actions">
          <button class="subbtn" onclick="applyManualCoords()">Áp dụng</button>
          <button class="subbtn secondary" onclick="fillFromMarker()">Lấy từ marker/map</button>
        </div>
        <small style="color:#6b7280;display:block;margin-top:.5rem">
          Mẹo: có thể dùng dấu <b>chấm</b> hoặc <b>phẩy</b>. Phạm vi hợp lệ: lat -90..90, lon -180..180.
        </small>
      </div>

      <!-- Các ô thông tin khác -->
      <div class="input-group">
        <label for="province">Tỉnh</label>
        <input type="text" id="province" placeholder="Nhập tên tỉnh" />
      </div>
      <div class="input-group">
        <label for="city">Thành phố/Địa chỉ</label>
        <input type="text" id="city" placeholder="Nhập thành phố hoặc địa chỉ cụ thể" />
      </div>
      <div class="input-group">
        <label for="filename">Tên file CSV</label>
        <input type="text" id="filename" placeholder="Nhập tên file (không cần .csv)" />
      </div>
    </div>

    <div id="status"></div>
    <button id="sendBtn" onclick="sendData()">📤 Gửi vị trí</button>
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="https://unpkg.com/leaflet-fullscreen@1.0.2/dist/Leaflet.fullscreen.min.js"></script>
  <script src="https://unpkg.com/leaflet.locatecontrol@0.79.0/dist/L.Control.Locate.min.js"></script>
  <script>
    let selectedLat = null;
    let selectedLon = null;
    let map, marker, geocoder;

    function enableSendButton() {
      const btn = document.getElementById("sendBtn");
      btn.classList.add("active");
    }

    // ======= MỚI: Nhập tọa độ thủ công =======
    function toggleManual() {
      const box = document.getElementById("manualBox");
      const isHidden = box.style.display === "none" || box.style.display === "";
      box.style.display = isHidden ? "block" : "none";
      box.setAttribute("aria-hidden", String(!isHidden));
      if (isHidden) {
        // điền sẵn nếu đang có selectedLat/Lon
        if (selectedLat != null) document.getElementById("latInput").value = String(selectedLat);
        if (selectedLon != null) document.getElementById("lonInput").value = String(selectedLon);
      }
    }

    function normalizeNumber(str) {
      if (typeof str !== "string") return NaN;
      // thay dấu phẩy bằng chấm, bỏ khoảng trắng
      const cleaned = str.trim().replace(",", ".");
      return parseFloat(cleaned);
    }

    function applyManualCoords() {
      const latStr = document.getElementById("latInput").value;
      const lonStr = document.getElementById("lonInput").value;
      const lat = normalizeNumber(latStr);
      const lon = normalizeNumber(lonStr);

      if (Number.isNaN(lat) || Number.isNaN(lon)) {
        setStatus("❌ Tọa độ không hợp lệ. Vui lòng nhập số.", true);
        return;
      }
      if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        setStatus("❌ Phạm vi không hợp lệ (lat -90..90, lon -180..180).", true);
        return;
      }

      selectedLat = lat;
      selectedLon = lon;

      // Nếu map đang mở, hiển thị marker
      if (map) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([selectedLat, selectedLon]).addTo(map);
        map.setView([selectedLat, selectedLon], 13);
      }

      setStatus(`✅ Đã nhập tọa độ: (${selectedLat.toFixed(5)}, ${selectedLon.toFixed(5)})`);
      enableSendButton();
    }

    function fillFromMarker() {
      if (selectedLat == null || selectedLon == null) {
        setStatus("ℹ️ Chưa có vị trí nào trên bản đồ.", true);
        return;
      }
      document.getElementById("latInput").value = String(selectedLat);
      document.getElementById("lonInput").value = String(selectedLon);
      setStatus("✅ Đã lấy tọa độ hiện tại vào ô nhập.");
    }
    // =========================================

    function setStatus(msg, isError = false) {
      const el = document.getElementById("status");
      el.innerText = msg;
      el.style.color = isError ? "#b91c1c" : "var(--text-light)";
    }

    function useCurrentLocation() {
      document.getElementById("map").style.display = "none";
      setStatus("⏳ Đang lấy vị trí của bạn...");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            selectedLat = position.coords.latitude;
            selectedLon = position.coords.longitude;
            setStatus(`✅ Vị trí của bạn: (${selectedLat.toFixed(5)}, ${selectedLon.toFixed(5)})`);
            enableSendButton();
            if (map && marker) {
              map.removeLayer(marker);
              marker = L.marker([selectedLat, selectedLon]).addTo(map);
              map.setView([selectedLat, selectedLon], 13);
            }
          },
          () => setStatus("❌ Không thể lấy vị trí hiện tại.", true)
        );
      } else {
        setStatus("❌ Trình duyệt không hỗ trợ định vị.", true);
      }
    }

    function useMapLocation() {
      setStatus("🗺️ Click hoặc tìm kiếm để chọn vị trí.");
      const mapEl = document.getElementById("map");
      mapEl.style.display = "block";
      if (!map) {
        map = L.map("map", {
          fullscreenControl: true,
          fullscreenControlOptions: { title: "Xem toàn màn hình", titleCancel: "Thoát toàn màn hình" },
        }).setView([10.75, 106.67], 6);

        L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, © <a href="http://viewfinderpanoramas.org">SRTM</a>, © <a href="https://opentopomap.org">OpenTopoMap</a>',
          maxZoom: 17,
        }).addTo(map);

        L.control.scale().addTo(map);
        L.control.locate({ position: "topleft", strings: { title: "Tìm vị trí của bạn" } }).addTo(map);

        geocoder = L.Control.Geocoder.nominatim({ geocodingQueryParams: { countrycodes: "vn" } });
        const searchControl = new L.Control.Geocoder({ geocoder, placeholder: "Tìm địa chỉ...", position: "topleft" }).addTo(map);

        map.on("geocode:result", (e) => {
          const { center } = e.result;
          selectedLat = center.lat; selectedLon = center.lng;
          if (marker) map.removeLayer(marker);
          marker = L.marker([selectedLat, selectedLon]).addTo(map);
          map.setView([selectedLat, selectedLon], 13);
          setStatus(`✅ Đã chọn vị trí: (${selectedLat.toFixed(5)}, ${selectedLon.toFixed(5)})`);
          enableSendButton();
        });

        map.on("click", (e) => {
          selectedLat = e.latlng.lat; selectedLon = e.latlng.lng;
          if (marker) map.removeLayer(marker);
          marker = L.marker([selectedLat, selectedLon]).addTo(map);
          map.setView([selectedLat, selectedLon], 13);
          setStatus(`✅ Đã chọn vị trí: (${selectedLat.toFixed(5)}, ${selectedLon.toFixed(5)})`);
          enableSendButton();
        });
      }
    }

    async function sendData() {
      const province = document.getElementById("province").value.trim();
      const city = document.getElementById("city").value.trim();
      const filename = document.getElementById("filename").value.trim() + ".csv";

      if (!selectedLat || !selectedLon || !province || !city || !document.getElementById("filename").value.trim()) {
        setStatus("❌ Vui lòng nhập đầy đủ thông tin.", true);
        return;
      }

      try {
        const response = await fetch("http://127.0.0.1:5000/location", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lat: selectedLat, lon: selectedLon, province, city, filename }),
        });

        if (response.ok) {
          setStatus("✅ Gửi thành công! Bạn có thể đóng trang này.");
        } else {
          setStatus("❌ Lỗi khi gửi dữ liệu.", true);
        }
      } catch (error) {
        setStatus("❌ Lỗi kết nối đến server.", true);
        console.error("Error:", error);
      }
    }
  </script>
</body>
</html>
